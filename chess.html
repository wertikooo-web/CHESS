<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <h1>Шахматы</h1>
        <div class="status" id="status">Ход белых</div>
        <div class="board" id="board"></div>
        <div class="controls">
            <button onclick="newGame()">Новая игра</button>
            <button onclick="undoMove()">Отменить ход</button>
            <button onclick="toggleAI()">AI (чёрные): <span id="ai-status">Вкл</span></button>
            <div class="difficulty">
                Сложность AI:
                <button onclick="setDifficulty(1)" id="diff-1">Легко</button>
                <button onclick="setDifficulty(2)" id="diff-2" class="active">Средне</button>
                <button onclick="setDifficulty(3)" id="diff-3">Сложно</button>
            </div>
        </div>
        <div id="captured-white" class="captured"></div>
        <div id="captured-black" class="captured"></div>
    </div>
    <script src="js/chess.js"></script>
</body>
</html>
