<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Шахматы — Полная версия</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div class="app">
        <header>
            <h1>♛ Шахматы</h1>
            <div class="status" id="status">Ход белых</div>
            <div class="coach" id="coach"></div>
        </header>

        <div class="main">
            <aside class="panel left-panel">
                <div class="panel-section">
                    <h3>История ходов</h3>
                    <div id="move-history" class="move-history"></div>
                </div>
                <div class="panel-section">
                    <h3>Захваченные</h3>
                    <div id="captured-white" class="captured"></div>
                    <div id="captured-black" class="captured"></div>
                </div>
                <div class="panel-section analysis-section">
                    <h3>Анализ партии</h3>
                    <div id="analysis" class="analysis">Нажмите «Анализ» после партии</div>
                    <button class="btn" style="width:100%;margin-top:4px" onclick="runPostGameAnalysis()">Анализ</button>
                </div>
            </aside>

            <div class="board-wrapper">
                <div class="coords-row top" id="coords-top"></div>
                <div class="board-row">
                    <div class="coords-col left" id="coords-left"></div>
                    <div class="board" id="board"></div>
                    <div class="coords-col right" id="coords-right"></div>
                </div>
                <div class="coords-row bottom" id="coords-bottom"></div>
            </div>

            <aside class="panel right-panel">
                <div class="panel-section timers span2">
                    <div class="timer" id="timer-black">
                        <span class="timer-label">Чёрные</span>
                        <span class="timer-value" id="time-black">10:00</span>
                    </div>
                    <div class="timer" id="timer-white">
                        <span class="timer-label">Белые</span>
                        <span class="timer-value" id="time-white">10:00</span>
                    </div>
                </div>

                <div class="right-panel-inner">
                    <div class="panel-section">
                        <h3>Режим</h3>
                        <div class="btn-group">
                            <button class="btn active" id="mode-ai" onclick="setMode('ai')">Против ИИ</button>
                            <button class="btn" id="mode-pvp" onclick="setMode('pvp')">2 игрока</button>
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3>Тема</h3>
                        <select id="theme-select" onchange="setTheme(this.value)">
                            <option value="classic">Классика</option>
                            <option value="wood">Дерево</option>
                            <option value="blue">Синяя</option>
                            <option value="green">Зелёная</option>
                            <option value="brown">Коричневая</option>
                            <option value="gray">Серая</option>
                        </select>
                    </div>

                    <div class="panel-section span2" id="ai-controls">
                        <h3>Сложность ИИ</h3>
                        <div class="btn-group">
                            <button class="btn" id="diff-1" onclick="setDifficulty(1)">Легко</button>
                            <button class="btn active" id="diff-2" onclick="setDifficulty(2)">Средне</button>
                            <button class="btn" id="diff-3" onclick="setDifficulty(3)">Сложно</button>
                            <button class="btn" id="diff-4" onclick="setDifficulty(4)">Макс</button>
                        </div>
                        <div class="btn-group" style="margin-top:6px">
                            <button class="btn active" id="color-white" onclick="setPlayerColor('white')">Белыми</button>
                            <button class="btn" id="color-black" onclick="setPlayerColor('black')">Чёрными</button>
                        </div>
                    </div>

                    <div class="panel-section span2">
                        <h3>Настройки</h3>
                        <div class="settings-grid">
                            <label class="toggle"><input type="checkbox" id="toggle-hints" checked onchange="toggleHints()"><span>Ходы фигур</span></label>
                            <label class="toggle"><input type="checkbox" id="toggle-sound" checked onchange="toggleSound()"><span>Звуки</span></label>
                            <label class="toggle"><input type="checkbox" id="toggle-coords" checked onchange="toggleCoords()"><span>Координаты</span></label>
                            <label class="toggle"><input type="checkbox" id="toggle-timer" checked onchange="toggleTimer()"><span>Таймер</span></label>
                            <label class="toggle"><input type="checkbox" id="toggle-anim" checked onchange="toggleAnim()"><span>Анимация</span></label>
                            <label class="toggle"><input type="checkbox" id="toggle-coach" onchange="toggleCoach()"><span>Обучение</span></label>
                        </div>
                    </div>

                    <div class="panel-section actions">
                        <button class="btn primary" onclick="newGame()">Новая игра</button>
                        <button class="btn" onclick="undoMove()">Отменить</button>
                        <button class="btn" onclick="undoMultiple()">−3 хода</button>
                        <button class="btn" onclick="hintBestMove()" title="Показывает самый сильный ход по оценке ИИ">Лучший ход</button>
                        <button class="btn" onclick="saveGame()">Сохранить</button>
                        <button class="btn" onclick="loadGame()">Загрузить</button>
                        <button class="btn" onclick="toggleFullscreen()">⛶ Экран</button>
                        <button class="btn" onclick="returnToLive()" id="btn-live" style="display:none">К партии</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="game-over">
        <div id="game-over-content">
            <div id="game-result"></div>
            <button class="btn primary" onclick="newGame(); hideGameOver()">Новая игра</button>
        </div>
    </div>

    <canvas id="confetti"></canvas>
    <script src="js/chess.js?v=3"></script>
</body>
</html>
